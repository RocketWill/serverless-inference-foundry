_BASE_: "Base-Keypoint-RCNN-FPN.yaml"
DATASETS:
  TRAIN: ("train", )
  TEST: ("val", )
DATALOADER:
  NUM_WORKERS: 4
MODEL:
  # WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  WEIGHTS: /workspace/output/id-5/model_0009999.pth
  RESNETS:
    DEPTH: 101
  ROI_KEYPOINT_HEAD:
    NUM_KEYPOINTS: 4
  ROI_HEADS:
    BATCH_SIZE_PER_IMAGE: 128   # faster, and good enough for this toy dataset
    NUM_CLASSES: 3
SOLVER:
  IMS_PER_BATCH: 80
  BASE_LR: 0.001
  GAMMA: 0.3
  STEPS: (890000, 900000)
  WARMUP_ITERS: 10
  MAX_ITER: 920000    # 300 iterations seems good enough, but you can certainly train longer
  CHECKPOINT_PERIOD: 10000
INPUT:
  MIN_SIZE_TRAIN: (200, 256, 320)
  MAX_SIZE_TRAIN: 320
  MIN_SIZE_TEST: 256
  MAX_SIZE_TEST: 320
