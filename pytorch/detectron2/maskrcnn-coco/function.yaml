spec:
  description: 适用一般场景且类别较多的分割任务
  runtime: 'python:3.8'
  handler: main:handler
  eventTimeout: 60s
  build:
    image: lkdi/pth.detectron2.maskrcnn.coco
    baseImage: willcy1006/lkdi-pytorch110_cu113:detectron2
    directives:
      preCopy:
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      maxWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      processorMountMode: volume
      restartPolicy:
        name: always
        maximumRetryCount: 3
