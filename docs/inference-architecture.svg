<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Nuclio inference architecture</title>
  <desc id="desc">The annotation orchestrator invokes independent Nuclio GPU functions. Each function loads a framework model, runs inference, and returns normalized annotation geometry.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.title{font:700 24px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.text{font:14px Inter,Arial,sans-serif;fill:#475569}.small{font:13px Inter,Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1200" height="600" rx="24"/>
  <text class="title" x="60" y="58">Nuclio Model-Serving Layer</text>
  <rect class="blue" x="60" y="205" width="240" height="150" rx="16"/>
  <text class="label" x="90" y="248">Annotation Orchestrator</text>
  <text class="text" x="90" y="282">Image or point cloud</text>
  <text class="text" x="90" y="308">Threshold and model id</text>
  <text class="text" x="90" y="334">Shared response contract</text>

  <rect class="orange" x="410" y="90" width="360" height="390" rx="18"/>
  <text class="label" x="440" y="130">Nuclio Function Container</text>
  <rect class="panel" x="445" y="165" width="290" height="70" rx="12"/>
  <text class="text" x="470" y="196">init_context</text><text class="small" x="470" y="217">load weights and reusable model state</text>
  <rect class="panel" x="445" y="260" width="290" height="70" rx="12"/>
  <text class="text" x="470" y="291">handler</text><text class="small" x="470" y="312">validate and decode request</text>
  <rect class="panel" x="445" y="355" width="290" height="90" rx="12"/>
  <text class="text" x="470" y="386">inference adapter</text><text class="small" x="470" y="407">preprocess · infer · postprocess</text><text class="small" x="470" y="428">format annotation geometry</text>

  <rect class="green" x="880" y="90" width="260" height="390" rx="18"/>
  <text class="label" x="910" y="130">Model Implementations</text>
  <rect class="panel" x="915" y="165" width="190" height="55" rx="10"/><text class="text" x="946" y="198">YOLO / YOLOR</text>
  <rect class="panel" x="915" y="240" width="190" height="55" rx="10"/><text class="text" x="956" y="273">Detectron2</text>
  <rect class="panel" x="915" y="315" width="190" height="55" rx="10"/><text class="text" x="958" y="348">OpenPCDet</text>
  <rect class="panel" x="915" y="390" width="190" height="55" rx="10"/><text class="text" x="958" y="423">Lane model</text>

  <path class="line" d="M300 280 H410"/><text class="small" x="325" y="267">invoke</text>
  <path class="line" d="M770 280 H880"/><text class="small" x="790" y="267">framework call</text>
  <path class="line" d="M410 390 C355 450 345 405 300 340"/><text class="small" x="302" y="455">normalized result</text>
  <text class="small" x="410" y="530">Each deployed function is isolated and can use a different framework image, weight set, and GPU allocation.</text>
</svg>
