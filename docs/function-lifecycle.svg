<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Nuclio function lifecycle</title>
  <desc id="desc">Nuclio starts a container, initializes model state once, accepts repeated requests, runs preprocessing and inference, formats results, and returns a response.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.once{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.repeat{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.title{font:700 24px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.text{font:13px Inter,Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="430" rx="24"/><text class="title" x="55" y="58">Function Initialization and Request Lifecycle</text>
  <rect class="box" x="55" y="145" width="155" height="105" rx="14"/><text class="label" x="82" y="185">Container start</text><text class="text" x="82" y="212">Nuclio runtime</text>
  <rect class="once" x="265" y="125" width="190" height="145" rx="14"/><text class="label" x="300" y="168">init_context</text><text class="text" x="292" y="198">resolve configuration</text><text class="text" x="292" y="220">load model and weights</text><text class="text" x="292" y="242">prepare GPU state</text>
  <rect class="repeat" x="510" y="145" width="155" height="105" rx="14"/><text class="label" x="555" y="185">handler</text><text class="text" x="535" y="212">decode request</text>
  <rect class="repeat" x="720" y="145" width="175" height="105" rx="14"/><text class="label" x="756" y="185">model inference</text><text class="text" x="748" y="212">preprocess and infer</text>
  <rect class="repeat" x="950" y="145" width="190" height="105" rx="14"/><text class="label" x="989" y="185">format response</text><text class="text" x="977" y="212">annotation geometry</text>
  <path class="line" d="M210 198 H265"/><path class="line" d="M455 198 H510"/><path class="line" d="M665 198 H720"/><path class="line" d="M895 198 H950"/>
  <text class="text" x="312" y="105">once per cold start</text><text class="text" x="680" y="105">repeated for each invocation</text>
  <path class="line" d="M1045 250 C1045 345 588 345 588 250"/><text class="text" x="748" y="370">next request reuses initialized model state</text>
</svg>
